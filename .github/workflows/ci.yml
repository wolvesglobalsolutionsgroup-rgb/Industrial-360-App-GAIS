name: CI Hardened Pipeline

on:
  push:
    branches: [ main, master, 'sprint/**' ]
  pull_request:
    branches: [ main, master, 'sprint/**' ]

jobs:
  security:
    name: Security Audit & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies for Audit
        run: npm ci

      - name: Security Audit (Production Dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit No Hardcoded Tenant & Secrets
        run: npm run audit:no-hardcoded-tenant

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (Software Bill of Materials)
        run: npx @cyclonedx/cyclonedx-npm --output-format JSON --output-file sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact
          path: sbom.json

  rules-check:
    name: Security Rules Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (for Firebase Emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore Rules Tests
        run: npm run test:rules

      - name: Run Storage Rules Tests
        run: npm run test:storage-rules

  build:
    name: Lint, Typecheck, Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Typecheck Root (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Typecheck Functions (tsc --noEmit)
        run: cd functions && npm ci && npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Run Unit Tests
        run: npm run test:unit
