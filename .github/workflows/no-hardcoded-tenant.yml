name: Guardia Anti-Hardcoding de Tenant

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'
  pull_request:
    paths:
      - 'src/**/*.ts'
      - 'src/**/*.tsx'

jobs:
  check-hardcoded-tenant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar Auditoría de Tenant y Secretos
        run: node scripts/auditNoHardcodedTenant.js
