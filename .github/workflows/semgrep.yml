name: Semgrep SAST Audit (IC360-NEXUS)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  semgrep:
    name: Security & Anti-Vibe SAST Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep Audit
        run: |
          semgrep scan \
            --config "p/typescript" \
            --config "p/react" \
            --config "p/nodejs" \
            --config "p/express" \
            --config "p/owasp-top-ten" \
            --config "p/secrets" \
            --config ".semgrep/ic360-security-rules.yml" \
            --error \
            --verbose
