rules:
  # 1. Multi-Tenant Guardrail
  - id: ic360-firestore-missing-tenant-id
    patterns:
      - pattern-either:
          - pattern: collection($DB, $COL).where(...)
          - pattern: query(collection($DB, $COL), ...)
      - pattern-not-inside: |
          ...
          where("tenantId", "==", ...)
          ...
    message: "[IC360-SECURITY] Consulta a Firestore sin filtro de 'tenantId'. Violación de aislamiento multitenant."
    languages: [typescript, javascript]
    severity: ERROR

  # 2. Anti-Vibe: No console.log in Production
  - id: ic360-no-console-log-in-production
    pattern: console.log(...)
    paths:
      exclude:
        - "src/tests/**"
        - "scripts/**"
    message: "[IC360-ANTI-VIBE] Uso de console.log en producción no permitido."
    languages: [typescript, javascript]
    severity: WARNING

  # 3. Anti-Vibe: No Hardcoded Secrets
  - id: ic360-no-hardcoded-secrets
    pattern-regex: '(?i)(api_key|secret|password|bearer_token)\s*[:=]\s*["''][A-Za-z0-9_\-]{16,}["'']'
    paths:
      exclude:
        - "tests/**"
        - "src/tests/**"
    message: "[IC360-SECURITY] Posible secreto codificado en código fuente."
    languages: [typescript, javascript]
    severity: ERROR

  # 4. Anti-Vibe: No Direct Firestore Import in UI Components
  - id: ic360-no-direct-firestore-import-in-components
    patterns:
      - pattern: import { ... } from 'firebase/firestore'
      - pattern-inside: |
          ...
    paths:
      include:
        - "src/components/**"
    message: "[IC360-ARCHITECTURE] Importación directa de Firestore SDK en componentes UI."
    languages: [typescript, javascript]
    severity: ERROR

  # 5. Anti-Vibe: Zod Schema Required for Writes
  - id: ic360-zod-schema-required-for-writes
    patterns:
      - pattern: setDoc($REF, $DATA, ...)
      - pattern-not-inside: |
          const $DATA = $SCHEMA.parse(...);
          ...
    message: "[IC360-SECURITY] Escritura en Firestore sin validación previa de schema Zod."
    languages: [typescript, javascript]
    severity: WARNING

  # 6. Anti-Vibe: No Unsanitized User Input in HTML
  - id: ic360-no-unsanitized-user-input-in-html
    patterns:
      - pattern: <$EL ... dangerouslySetInnerHTML={{ __html: $VAR }} ... />
      - pattern-not-inside: |
          $CLEAN = DOMPurify.sanitize($VAR);
          ...
          <$EL ... dangerouslySetInnerHTML={{ __html: $CLEAN }} ... />
    message: "[IC360-SECURITY] Renderizado directo de HTML sin desinfectar con DOMPurify."
    languages: [typescript, javascript]
    severity: ERROR
