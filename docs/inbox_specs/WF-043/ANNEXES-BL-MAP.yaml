# WF-043: MAPA DOCUMENTAL Y ESTRUCTURA DE ANEXOS
**Documento Base:** PDVSA IR-S-04 Rev. 4

## Mapa de Permisos y Certificados
1. **Formulario Anexo A:** Permiso Principal (Trabajos en Frío y Caliente).
2. **Formulario Anexo B:** Certificado para Espacios Confinados.
3. **Formulario Anexo C:** Certificado para Izamiento de Cargas Críticas.
4. **Formulario Anexo D:** Certificado para Radiaciones Ionizantes.
5. **Formulario Anexo E:** Certificado para Excavaciones.
6. **Formulario Anexo F:** Certificado para Aislamiento Eléctrico (LOTO SI-S-28).
7. **Formulario Anexos G-L:** Certificados Especiales Especializados.
