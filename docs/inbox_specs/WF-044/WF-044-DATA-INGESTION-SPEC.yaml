workflowId: "WF-044"
ingestionSchema:
  header:
    numeroArt: { type: "STRING", required: true, rule: "AUTO_GENERATED" }
    tituloTrabajo: { type: "STRING", required: true }
    instalacionArea: { type: "STRING", required: true }
    empresa: { type: "STRING", required: true }
    ordenSapNumero: { type: "STRING", required: false }
    contratoNumero: { type: "STRING", required: true }
    fechaElaboracion: { type: "DATE", required: true }
  tableSteps:
    type: "ARRAY_OBJECT"
    items:
      pasoNumero: { type: "INTEGER", required: true }
      pasoDescripcion: { type: "STRING", required: true }
      peligrosIdentificados: { type: "ARRAY_STRING", required: true }
      medidasPreventivas: { type: "ARRAY_STRING", required: true }
  signatures:
    emisorCustodio: { type: "OBJECT", required: true }
    receptorSupervisor: { type: "OBJECT", required: true }
    ejecutorLider: { type: "OBJECT", required: true }
    trabajadoresCuadrilla: { type: "ARRAY_OBJECT", required: true }
