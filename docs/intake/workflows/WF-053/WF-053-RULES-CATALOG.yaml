rulesCatalog:
  workflowId: "WF-053"
  sourceStandards:
    - "PDVSA PIC-03-01-09"
    - "PDVSA PIC-03-01-16"
    - "PDVSA PIC-03-01-19"
    - "PDVSA PIC-03-01-13"

  rules:
    - id: "RULE-HARD-01"
      name: "Bloqueo de Valuación sin Firma de Asiento Diario en Libro de Obra"
      type: "HARD_BLOCK"
      citation:
        document: "PDVSA PIC-03-01-16 & PIC-03-01-19"
        section: "Anexo B §XVI y §6.5"
        page: 7
        exactQuote: "Las actividades reflejadas en el reporte de medición deben coincidir diariamente con el registro del Libro de Obra."
      logic: "es_valuacion_presentada == true => firma_diaria_libro_obra == true"

    - id: "RULE-HARD-02"
      name: "Bloqueo de Valuación sin Validación ACCC de Aseguramiento de Calidad"
      type: "HARD_BLOCK"
      citation:
        document: "PDVSA PIC-03-01-19"
        section: "Sec. 6.7"
        page: 4
        exactQuote: "Verificar que las obras informadas no presenten discrepancia respecto a las pautas fijadas en el Plan de Calidad y las Normas de Calidad de PDVSA."
      logic: "es_valuacion_presentada == true => validacion_accc_aprobada == true"

    - id: "RULE-HARD-03"
      name: "Retención Legal Obligatoria del 5% por Garantía de Fiel Cumplimiento"
      type: "HARD_BLOCK"
      citation:
        document: "PDVSA PIC-03-01-19 / Decreto 1.417"
        section: "Sec. 6.11"
        page: 5
        exactQuote: "Deducir de cada valuación el porcentaje correspondiente a la retención de garantía estipulada en el contrato."
      logic: "monto_retencion == monto_bruto_valuado * 0.05"

    - id: "RULE-HARD-04"
      name: "Prohibición de Acta de Recepción Provisional con Punch List Catálogo A Activo"
      type: "HARD_BLOCK"
      citation:
        document: "PDVSA PIC-03-01-09"
        section: "Sec. 6.1, Anexo B, C"
        page: "4, 7-8"
        exactQuote: "La completación mecánica requiere el cierre total de puntos pendientes de construcción no relacionados con la operación."
      logic: "es_recepcion_provisional == true => cantidad_punch_list_catalogo_a == 0"

    - id: "RULE-HARD-05"
      name: "Obligatoriedad de Entrega de Planos As-Built Ratificados para Valuación Final"
      type: "HARD_BLOCK"
      citation:
        document: "PDVSA PIC-03-01-19 & PIC-03-01-13"
        section: "Sec. 6.13, Sec. 6.7"
        page: "5, 5"
        exactQuote: "Someter la valuación final con los planos Como Construidos aprobados y la devolución de materiales sobrantes."
      logic: "es_valuacion_final == true => planos_as_built_ratificados == true AND balance_materiales_entregado == true"

    - id: "RULE-EXEC-01"
      name: "Cotejo Obligatorio de Planos As-Built contra Consultas RFI PIC-03-01-12"
      type: "REQUIRED_BEFORE_CLOSE"
      citation:
        document: "PDVSA PIC-03-01-13"
        section: "Sec. 6 Paso 5"
        page: 5
        exactQuote: "Cotejar en conjunto contra los cambios y modificaciones aprobadas en la Base de Registros de Consulta de Ingeniería de Campo."
      logic: "planos_as_built_cotejados_rfi == true"
