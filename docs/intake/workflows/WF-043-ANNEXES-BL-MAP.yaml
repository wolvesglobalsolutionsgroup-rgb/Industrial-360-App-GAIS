workflow_id: wf-043-aprobacion-ptw
title: Permiso de Trabajo Seguro (PTW SIHO-A PDVSA IR-S-04)
normative_reference: PDVSA IR-S-04 Rev. 4 / PDVSA IR-S-17 / PDVSA SI-S-20
annexes:
  - annex_code: ANEXO-A
    title: Permiso de Trabajo Seguro Core (Frío / Caliente)
    mandatory: true
    hard_blocks:
      - rule: HB-043-01
        condition: contractorEligibility.contractorStatus != 'APTA'
        message: "HARD_BLOCK: La empresa contratista no posee estatus APTA."
      - rule: HB-043-02
        condition: contractorEligibility.sihoaPlanApproved != true
        message: "HARD_BLOCK: El Plan SIHOA de la empresa contratista no está aprobado."
      - rule: HB-043-03
        condition: preStartReadiness.artApproved != true
        message: "HARD_BLOCK: El Análisis de Riesgos del Trabajo (ART PDVSA IR-S-17) debe estar aprobado."
      - rule: HB-043-04
        condition: preStartReadiness.procedureApproved != true
        message: "HARD_BLOCK: El Procedimiento de Trabajo (PDVSA SI-S-20) debe estar aprobado."
      - rule: HB-043-05
        condition: workType == 'caliente' && gasTest.lelPercentage != 0
        message: "HARD_BLOCK: Trabajo en Caliente exige 0.0% v/v LEL de gas inflamable."
      - rule: HB-043-06
        condition: startTime != gasTest.testTime
        message: "HARD_BLOCK: La hora de inicio debe coincidir exactamente con la hora de prueba inicial de gas."
      - rule: HB-043-07
        condition: maxDurationHours > (isPlantShutdownOrMajorMaint ? 12 : 8)
        message: "HARD_BLOCK: Duración excede el límite permitido."
  - annex_code: ANEXO-B
    title: Trabajos en Altura
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'altura'"
    requirements:
      - arnes_certificado: true
      - lnea_de_vida_inspeccionada: true
      - andamio_tarjeta_verde: true
  - annex_code: ANEXO-C
    title: Izaje de Cargas Críticas
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'izaje'"
    requirements:
      - plan_de_izaje_aprobado: true
      - operador_y_riggerm_certificados: true
      - inspeccion_preuso_grua: true
  - annex_code: ANEXO-D
    title: Entrada a Espacios Confinados
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'espacio_confinado'"
    requirements:
      - monitoreo_atmosferico_continuo: true
      - vigia_de_seguridad_asignado: true
      - plan_de_rescate_activo: true
  - annex_code: ANEXO-E
    title: Excavaciones y Zanjas
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'excavacion'"
  - annex_code: ANEXO-F
    title: Intervención de Líneas Eléctricas
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'electrico'"
  - annex_code: ANEXO-G
    title: Radiografía Industrial
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'radiografia'"
  - annex_code: ANEXO-H
    title: Perforación en Caliente (Hot Tapping)
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'hot_tapping'"
  - annex_code: ANEXO-I
    title: Demolición y Chorreado Abrasivo
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'demolicion'"
  - annex_code: ANEXO-J
    title: Trabajos Sobre Agua
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'sobre_agua'"
  - annex_code: ANEXO-K
    title: Manejo de Sustancias Químicas / H2S
    mandatory_if: "preStartReadiness.specialCertificatesRequired contains 'sustancias_peligrosas'"
