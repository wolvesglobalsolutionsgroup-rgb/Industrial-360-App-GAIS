annexesBLMap:
  workflowId: "WF-043"
  sourceStandard: "PDVSA IR-S-04 Rev 4 (Agosto 2013)"
  availabilityStatus: "AVAILABLE_IN_PRIMARY_STANDARD"
  developmentStatus: "PERMITTED"

  annexes:
    - id: "ANEXO_B"
      name: "Certificado de Espacios Confinados"
      purpose: "Autorizar el ingreso seguro de personal a tanques, recipientes, zanjas profundas o espacios con cobertura limitada de ventilación."
      activationTrigger: "Trabajo a realizarse dentro de un espacio confinado (§11.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "36-38"
        section: "Sección 11 y Anexo B"
      fields:
        - { id: "equipoRecipiente", name: "Nombre / Tag del Recipiente", type: "STRING", required: true }
        - { id: "aislamientoMecanico", name: "Ciegas / Desconexiones Instaladas", type: "BOOLEAN", required: true }
        - { id: "voltajeIluminacion", name: "Voltaje Máximo de Iluminación (<=24V)", type: "NUMBER", required: true }
        - { id: "observadorStandby", name: "Nombre del Observador de Standby", type: "STRING", required: true }
      checklist:
        - "Lavado y purgado de recipiente completado"
        - "LOTO mecánico e instrumental aplicado"
        - "Prueba de gas realizada en fondo, centro y parte superior"
        - "Observador de superficie permanentemente posicionado en la entrada"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "EVALUADOR_GAS", "OBSERVADOR_STANDBY"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "EVALUADOR_GAS"]
      evidence: ["Certificado Anexo B firmado", "Foto de ciego instalado", "Registro de prueba de gas en 3 niveles"]
      validations:
        - "0% LEL, Oxígeno 19.5% a 23.5%"
        - "Presencia de observador de superficie obligatorio"
      deliverable: "Certificado Anexo B firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo B"
      relationToOtherAnnexes: ["ANEXO_F (LOTO Eléctrico si hay agitadores)", "ANEXO_L (Soldadura en espacio confinado)"]
      externalRuleRequired: "PDVSA HO-H-06"
      externalParameterStatus: "PENDING_EXTERNAL_PARAMETER"

    - id: "ANEXO_C"
      name: "Certificado de Izamiento de Cargas"
      purpose: "Garantizar la seguridad operacional en maniobras de izamiento crítico de cargas pesadas o sobre instalaciones operativas."
      activationTrigger: "Uso de grúas móviles o fijas para izamiento de cargas (§12.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "39-42"
        section: "Sección 12 y Anexo C"
      referenceStandard: "PDVSA PI-15-02-01 (CONFIRMADO PDF)"
      fields:
        - { id: "equipoGrúa", name: "Tipo / Serial de Grúa", type: "STRING", required: true }
        - { id: "capacidadNominal", name: "Capacidad Nominal de Grúa (Toneladas)", type: "NUMBER", required: true }
        - { id: "pesoCarga", name: "Peso de la Carga a Izar (Toneladas)", type: "NUMBER", required: true }
        - { id: "ratioIzamiento", name: "Ratio de Carga (% de Capacidad)", type: "NUMBER", required: true }
        - { id: "riggerNombre", name: "Nombre de Rigger / Signalman Certificado", type: "STRING", required: true }
      checklist:
        - "Inspección pre-uso de grúa y guayas aprobada"
        - "Terreno nivelado y estabilizadores extendidos al 100%"
        - "Radio de giro demarcado y acordonado"
        - "Cálculo de riggers <80% de capacidad nominal"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "OPERADOR_GRUAS", "RIGGER_CERTIFICADO"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "OPERADOR_GRUAS"]
      evidence: ["Plan de Izamiento (Rigger Plan)", "Certificación de Grúa vigente", "Foto de demarcación de radio"]
      validations:
        - "Ratio de izamiento debe ser < 80% para cargas críticas"
        - "Verificación de interferencias con líneas de alta tensión"
      deliverable: "Certificado Anexo C firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo C"
      relationToOtherAnnexes: ["ANEXO_J (Trabajos en Altura durante enganche)"]
      externalRuleRequired: "ASME B30.5"
      externalParameterStatus: "PERMITTED"

    - id: "ANEXO_D"
      name: "Certificado de Radiaciones Ionizantes"
      purpose: "Controlar la exposición radiológica durante ensayos no destructivos (Gammatrafía / Gammagrafía) o calibración de fuentes."
      activationTrigger: "Uso de fuentes radiactivas selladas o equipos generadores (§13.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "43-45"
        section: "Sección 13 y Anexo D"
      referenceStandard: "PDVSA PR-H-08 Rev 1 (CONFIRMADO PDF)"
      fields:
        - { id: "tipoFuente", name: "Isótopo / Fuente (ej. Iridio-192, Cobalto-60)", type: "STRING", required: true }
        - { id: "actividadCuries", name: "Actividad de la Fuente (Curies / Bq)", type: "NUMBER", required: true }
        - { id: "operadorRadiologico", name: "Nombre Operador / Dosímetro No.", type: "STRING", required: true }
        - { id: "tasaDosisPerímetro", name: "Tasa de Dosis en Barrera (uSv/h)", type: "NUMBER", required: true }
      checklist:
        - "Autorización CAPRA vigente verificada"
        - "Perímetro de seguridad demarcado a <0.5 uSv/h"
        - "Luces intermitentes y avisos de peligro instalados"
        - "Dosímetros de pluma y película activos en operadores"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "OPERADOR_RADIOLOGICO", "OFICIAL_CAPRA"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "OPERADOR_RADIOLOGICO"]
      evidence: ["Permiso CAPRA vigente", "Registro de lecturas dosimétricas", "Foto de acordonamiento periférico"]
      validations:
        - "Tasa de dosis externa en perímetro <= 0.5 uSv/h"
        - "Transporte amparado por PDVSA PR-H-08"
      deliverable: "Certificado Anexo D firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo D"
      relationToOtherAnnexes: ["ANEXO_L (Inspección NDT de soldadura)"]
      externalRuleRequired: "PDVSA PR-H-08"
      externalParameterStatus: "PERMITTED"

    - id: "ANEXO_E"
      name: "Certificado de Excavaciones"
      purpose: "Prevenir colapsos de pared, atrapamiento y daños a interferencias subterráneas (tuberías, cables eléctricos/instrumentación)."
      activationTrigger: "Excavación a cielo abierto con profundidad mayor a 0.30m (§14.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "46-48"
        section: "Sección 14 y Anexo E"
      fields:
        - { id: "dimensionesExcavación", name: "Largo x Ancho x Profundidad (m)", type: "STRING", required: true }
        - { id: "tipoSuelo", name: "Clasificación de Suelo (A, B, C)", type: "STRING", required: true }
        - { id: "sistemaProtecciónPared", name: "Entibado / Talud Aplicado", type: "STRING", required: true }
        - { id: "firmaElectricidad", name: "Firma Supervisor Electricidad", type: "STRING", required: true }
        - { id: "firmaInstrumentación", name: "Firma Supervisor Telecom/Instrumentación", type: "STRING", required: true }
      checklist:
        - "Brazado manual inicial hasta 1.20m completado"
        - "Planos As-Built de tuberías y cables subterráneos consultados"
        - "Firmas de supervisores de servicios públicos obtenidas"
        - "Acceso / Salida (escaleras cada 7.5m) instaladas"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "SUPERVISOR_ELECTRICIDAD", "SUPERVISOR_INSTRUMENTACION"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "SUPERVISOR_ELECTRICIDAD", "SUPERVISOR_INSTRUMENTACION"]
      evidence: ["Plano de interferencias subterráneas", "Foto de entibado / talud", "Firmas de cruzamiento de servicios"]
      validations:
        - "Entibado obligatorio para profundidad > 1.50m en suelo inestable"
        - "Distancia de acopio de material > 1.0m del borde de excavación"
      deliverable: "Certificado Anexo E firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo E"
      relationToOtherAnnexes: ["ANEXO_B (Si la excavación califica como espacio confinado P>1.5m)"]
      externalRuleRequired: "COVENIN 2247"
      externalParameterStatus: "PENDING_EXTERNAL_PARAMETER"

    - id: "ANEXO_F"
      name: "Certificado de Sistema Eléctrico"
      purpose: "Garantizar el aislamiento eléctrico, la desenergización comprobada y el bloqueo LOTO de líneas de alta/baja tensión."
      activationTrigger: "Trabajos en o cerca de circuitos eléctricos o subestaciones (§15.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "49-52"
        section: "Sección 15 y Anexo F"
      referenceStandard: "PDVSA SI-S-28 (CONFIRMADO PDF)"
      fields:
        - { id: "circuitoSubestacion", name: "Nombre / Tag de Subestación / Celdas", type: "STRING", required: true }
        - { id: "nivelVoltaje", name: "Nivel de Voltaje (kV / V)", type: "NUMBER", required: true }
        - { id: "bloqueoLotoNo", name: "Número de Tarjeta LOTO (PDVSA SI-S-28)", type: "STRING", required: true }
        - { id: "aprobacionDespachoCarga", name: "Aprobación Despacho de Carga (Si aplica)", type: "STRING", required: false }
      checklist:
        - "Interruptores abiertos y bloqueados con candado y tarjeta LOTO"
        - "Comprobación de ausencia de tensión con revelador probado"
        - "Puestas a tierra temporales instaladas en ambos lados"
        - "Diagrama unifilar firmado por especialista eléctrico"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "ESPECIALISTA_ELECTRICO", "OPERADOR_DESPACHO_CARGA"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "ESPECIALISTA_ELECTRICO"]
      evidence: ["Registro LOTO SI-S-28", "Foto de candados y tarjetas en celda", "Comprobación de cero voltaje"]
      validations:
        - "Ausencia de tensión verificada previa a la firma"
        - "Solicitud a Despacho de Carga 72h antes para trabajos en alta tensión"
      deliverable: "Certificado Anexo F firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo F"
      relationToOtherAnnexes: ["ANEXO_B (Desenergización de agitadores en recipientes)"]
      externalRuleRequired: "PDVSA SI-S-29 / SI-S-32"
      externalParameterStatus: "PENDING_EXTERNAL_PARAMETER"

    - id: "ANEXO_G"
      name: "Certificado de Trabajos Subacuáticos y Superficies Acuáticas"
      purpose: "Garantizar la protección de buzos y personal sobre embarcaciones o muelles marinos/lacustres."
      activationTrigger: "Operaciones de buceo o trabajos sobre cuerpos de agua (§16.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "53-55"
        section: "Sección 16 y Anexo G"
      fields:
        - { id: "embarcaciónSoporte", name: "Nombre / Matrícula de Lancha / Gabarra", type: "STRING", required: true }
        - { id: "profundidadBuceo", name: "Profundidad Operativa (m / pies)", type: "NUMBER", required: true }
        - { id: "buzoStandby", name: "Nombre de Buzo de Emergencia / Rescatista", type: "STRING", required: true }
      checklist:
        - "Buceo en pareja certificado"
        - "Bote de rescate motorizado listo al costado"
        - "Tablas de descompresión y cámara hiperbárica disponible"
        - "Banderas de señalización de buzo sumergido (Bandera Alfa) izadas"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "SUPERVISOR_BUCEO", "CAPITÁN_EMBARCACIÓN"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "SUPERVISOR_BUCEO"]
      evidence: ["Bitácora de buceo", "Certificación de mezcla/compresor", "Foto de bote de rescate"]
      validations:
        - "Presencia obligatoria de buzo de reserva en superficie"
      deliverable: "Certificado Anexo G firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo G"
      relationToOtherAnnexes: ["ANEXO_H (Hot-Tapping subacuático)"]
      externalRuleRequired: "PDVSA SI-S-04 / COVENIN"
      externalParameterStatus: "PERMITTED"

    - id: "ANEXO_H"
      name: "Certificado de Interconexión en Caliente (Hot-Tapping)"
      purpose: "Autorizar la perforación y soldadura sobre tuberías o recipientes bajo presión de fluidos activos."
      activationTrigger: "Trabajos de intervención y perforación de líneas vivas (§17.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "56-58"
        section: "Sección 17 y Anexo H"
      fields:
        - { id: "lineaTag", name: "Tag de Línea / Equipo", type: "STRING", required: true }
        - { id: "presiónOperación", name: "Presión de Operación durante Perforación (PSI)", type: "NUMBER", required: true }
        - { id: "temperaturaFluido", name: "Temperatura del Fluido (°C / °F)", type: "NUMBER", required: true }
        - { id: "espesorParedMedido", name: "Espesores Ultrasonido Medidos (mm)", type: "NUMBER", required: true }
        - { id: "epsSoldaduraNo", name: "Especificación de Procedimiento Soldadura (EPS)", type: "STRING", required: true }
      checklist:
        - "Prueba hidrostatica de la montura y máquina de perforación aprobada"
        - "Medición de espesor remanente por ultrasonido comprobada"
        - "Cálculo de velocidad de flujo mínimo para disipación de calor"
        - "Válvula de corte probada para cierre 100% hermético"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "ESPECIALISTA_HOT_TAP", "GERENTE_CUSTODIO"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "ESPECIALISTA_HOT_TAP", "GERENTE_CUSTODIO"]
      evidence: ["Procedimiento Hot-Tap aprobado", "Reporte de inspección por ultrasonido", "Certificado de prueba hidrostática de cortadora"]
      validations:
        - "Firma indispensable de aprobación del Gerente Custodio de la Instalación"
        - "Espesor de pared > mínimo requerido por código ASME B31.3"
      deliverable: "Certificado Anexo H firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo H"
      relationToOtherAnnexes: ["ANEXO_L (Soldadura)", "ANEXO_D (NDT de soldadura de montura)"]
      externalRuleRequired: "API 1104 / ASME B31.3"
      externalParameterStatus: "PERMITTED"

    - id: "ANEXO_I"
      name: "Certificado de Áreas Compartidas / Múltiples Custodios"
      purpose: "Coordinar la interferencia de riesgos cuando los trabajos impactan instalaciones limítrofes o de múltiples custodios."
      activationTrigger: "Trabajos dentro de la franja de seguridad de otras gerencias o filiales (§18.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "59-60"
        section: "Sección 18 y Anexo I"
      fields:
        - { id: "custodiosAfectados", name: "Lista de Gerencias / Custodios Afectados", type: "ARRAY_STRING", required: true }
        - { id: "notificacionPrevioDias", name: "Días de Notificación Previa (>=5 días)", type: "NUMBER", required: true }
      checklist:
        - "Notificación escrita enviada 5 días continuos antes"
        - "Reunión de coordinación de riesgos realizada"
        - "Firmas de todos los custodios de áreas colindantes obtenidas"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "CUSTODIOS_COLINDANTES"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "CUSTODIOS_COLINDANTES"]
      evidence: ["Oficio de notificación a custodios colindantes", "Minuta de reunión de interferencias"]
      validations:
        - "Firmas completas de los custodios de todas las áreas impactadas"
      deliverable: "Certificado Anexo I firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo I"
      relationToOtherAnnexes: ["ANEXO_E (Excavación cerca de corredores compartidos)"]
      externalRuleRequired: "PDVSA IR-S-16"
      externalParameterStatus: "PENDING_EXTERNAL_PARAMETER"

    - id: "ANEXO_J"
      name: "Certificado de Trabajos en Altura"
      purpose: "Garantizar la protección contra caídas en trabajos realizados a más de 1.50m del nivel del piso."
      activationTrigger: "Trabajo en altura sobre andamios, plataformas o estructuras > 1.50m (§19.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "61-63"
        section: "Sección 19 y Anexo J"
      fields:
        - { id: "alturaMetros", name: "Altura de Trabajo (m)", type: "NUMBER", required: true }
        - { id: "andamieroCertificado", name: "Nombre / Carnet de Andamiero Certificado", type: "STRING", required: true }
        - { id: "tarjetaAndamioEstatus", name: "Color de Tarjeta de Andamio (VERDE / ROJA)", type: "STRING", required: true }
      checklist:
        - "Andamio inspeccionado y marcado con Tarjeta VERDE"
        - "Relación base a altura 4:1 cumplida o arriostrado"
        - "Arnés de cuerpo entero con doble cabo de vida y absorbedor de impacto"
        - "Puntos de anclaje probados para resistencia > 2270 kg (5000 lbs)"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "INSPECTOR_ANDAMIOS"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "INSPECTOR_ANDAMIOS"]
      evidence: ["Tarjeta de inspección de andamio (Copia)", "Certificación de arnés y líneas de vida", "Foto de estructura de andamio"]
      validations:
        - "Tarjeta VERDE obligatoria en andamio para autorizar ascenso"
        - "Uso 100% obligatorio de doble cabo de vida durante desplazamientos"
      deliverable: "Certificado Anexo J firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo J"
      relationToOtherAnnexes: ["ANEXO_C (Izamiento de andamios / estructuras)"]
      externalRuleRequired: "PDVSA SI-S-27 / SI-S-31"
      externalParameterStatus: "PENDING_EXTERNAL_PARAMETER"

    - id: "ANEXO_K"
      name: "Certificado de Fumigación y Control de Plagas"
      purpose: "Garantizar la ventilación y tiempos de reentrada segura tras aplicación de biocidas o plaguicidas."
      activationTrigger: "Aplicación de productos químicos de fumigación en instalaciones (§20.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "64-66"
        section: "Anexo K"
      fields:
        - { id: "productoQuimico", name: "Nombre Comercial / Ingrediente Activo Biocida", type: "STRING", required: true }
        - { id: "hojaMsdsDisponible", name: "Disponibilidad de Hoja MSDS", type: "BOOLEAN", required: true }
        - { id: "tiempoReentradaHoras", name: "Tiempo de Reentrada Segura (Horas)", type: "NUMBER", required: true }
      checklist:
        - "Hoja de Seguridad MSDS disponible en sitio"
        - "Permisos de MPPSALUD / INSAI vigentes de la contratista"
        - "Notificación a personal ocupante y desalojo total previo"
        - "Avisos de advertencia en todas las puertas de acceso"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "TECNICO_FUMIGACION"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "TECNICO_FUMIGACION"]
      evidence: ["Hoja MSDS del producto", "Permiso sanitario INSAI/MPPSALUD", "Foto de avisos de bloqueo de acceso"]
      validations:
        - "Cumplimiento estricto del tiempo de reentrada previo a la desmovilización"
      deliverable: "Certificado Anexo K firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo K"
      relationToOtherAnnexes: []
      externalRuleRequired: "Normas Sanitarias MPPSALUD"
      externalParameterStatus: "PERMITTED"

    - id: "ANEXO_L"
      name: "Certificado de Soldadura y Trabajos en Caliente Específicos"
      purpose: "Controlar los riesgos de ignición, quemaduras y radiación ultravioleta durante operaciones de soldadura y corte."
      activationTrigger: "Uso de máquinas de soldar, oxicorte o esmerilado (§21.1)"
      sourceCitation:
        document: "PDVSA IR-S-04 Rev 4"
        pages: "67-69"
        section: "Anexo L"
      referenceStandard: "API 1104 / ASME IX (CONFIRMADO PDF)"
      fields:
        - { id: "epsProcedimientoNo", name: "Número de EPS Aprobada", type: "STRING", required: true }
        - { id: "soldadorEstampa", name: "Nombre / Estampa de Soldador Certificado", type: "STRING", required: true }
        - { id: "maquinaSoldarSerial", name: "Serial de Máquina / Matachispas Verificado", type: "STRING", required: true }
      checklist:
        - "Extintor PQS de 20 lbs al pie de la soldadura"
        - "Mantas ignífugas y biombos de protección instalados"
        - "Matachispas certificado en escape de motor de combustión"
        - "Prueba de gas 0% LEL continua durante la soldadura"
      roles: ["EMISOR", "RECEPTOR", "EJECUTOR", "SOLDADOR_CERTIFICADO", "BOMBERO_STANDBY"]
      signatures: ["EMISOR", "RECEPTOR", "EJECUTOR", "SOLDADOR_CERTIFICADO"]
      evidence: ["Certificación de Soldador (WPQ) según API 1104/ASME IX", "Hoja de especificación EPS", "Foto de mantas ignífugas"]
      validations:
        - "0% LEL en gas test antes de encender arco"
        - "Matachispas en motor diésel en áreas clasificadas"
      deliverable: "Certificado Anexo L firmado impreso / PDF"
      relationToAnexoA: "Adjunto obligatorio al Anexo A cuando Renglón 9 marca Anexo L"
      relationToOtherAnnexes: ["ANEXO_H (Hot-Tap)", "ANEXO_D (NDT de soldadura)"]
      externalRuleRequired: "API 1104 / ASME IX"
      externalParameterStatus: "PERMITTED"
