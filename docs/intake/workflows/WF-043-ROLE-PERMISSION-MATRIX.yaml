rolePermissionMatrix:
  workflowId: "WF-043"

  roles:
    - id: "EMISOR"
      name: "Emisor del Permiso (Custodio / Autorizado PDVSA)"
      permissions:
        - "CREATE_PTW"
        - "APPROVE_PRE_START"
        - "SIGN_ISSUANCE"
        - "SIGN_EXTENSION"
        - "SUSPEND_PTW"
        - "CANCEL_PTW"
        - "SIGN_CLOSEOUT"

    - id: "RECEPTOR"
      name: "Receptor del Permiso (Supervisor Contratista / PDVSA)"
      permissions:
        - "CREATE_PTW"
        - "REQUEST_ANNEXES"
        - "SIGN_ISSUANCE"
        - "SIGN_EXTENSION"
        - "SIGN_CLOSEOUT"

    - id: "EJECUTOR"
      name: "Ejecutor del Trabajo (Líder de Cuadrilla)"
      permissions:
        - "SIGN_ISSUANCE"
        - "SIGN_EXTENSION"
        - "SIGN_CLOSEOUT"

    - id: "EVALUADOR_GAS"
      name: "Evaluador de Gas Certificado"
      permissions:
        - "RECORD_GAS_TEST"
        - "SIGN_GAS_TEST"

    - id: "GERENTE_CUSTODIO"
      name: "Gerente Custodio de la Instalación"
      permissions:
        - "APPROVE_HOT_TAP_ANEXO_H"
        - "AUTHORIZE_HUMAN_OVERRIDE_EXCEPTIONS"

    - id: "SUPERINTENDENTE_SIHOA"
      name: "Superintendente SIHOA"
      permissions:
        - "AUDIT_PTW"
        - "AUTHORIZE_HUMAN_OVERRIDE_EXCEPTIONS"
