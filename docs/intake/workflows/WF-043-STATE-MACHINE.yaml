  - id: SUBMITTED
    label: Enviado a Revisión
  - id: UNDER_REVIEW
    label: En Revisión Custodio / SIHO
  - id: CHANGES_REQUESTED
    label: Observaciones Solicitadas
  - id: APPROVED
    label: Prerrequisitos Aprobados
  - id: ISSUED
    label: Permiso Otorgado y Emitido
  - id: SUSPENDED
