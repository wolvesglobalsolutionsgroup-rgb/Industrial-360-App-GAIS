# Especificación Completa de Ingesta y Esquemas Zod: `wf-043`

workflowId: wf-043-aprobacion-ptw
version: "1.2.0-PROPOSED"
status: PROPOSED_SPECIFICATION
primarySource: "PDVSA IR-S-04 (Págs. 33-35)"
secondarySources:
  - "PDVSA IR-S-17 (Págs. 12-15)"
  - "PDVSA SI-S-20 (Págs. 5-11)"

inputDefinitionsAnexoA:
  - fieldId: workType
    label: "Tipo de Permiso de Trabajo"
    type: enum
    enumValues: ["EN_FRIO", "EN_CALIENTE"]
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    captureMethod: UI_RADIO_TOGGLE
    validationRules: "z.enum(['EN_FRIO', 'EN_CALIENTE'])"

  - fieldId: sapOrderNumber
    label: "Orden SAP N°"
    type: string
    required: false
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    captureMethod: UI_TEXT_INPUT
    validationRules: "z.string().optional()"

  - fieldId: ptwCode
    label: "Permiso N°"
    type: string
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    captureMethod: UI_AUTO_CORRELATIVENO
    validationRules: "z.string().min(3, 'El número de permiso debe tener al menos 3 caracteres')"

  - fieldId: facilityLocation
    label: "Instalación / Área / Unidad y Equipo"
    type: object
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    properties:
      facility: { type: string, required: true }
      area: { type: string, required: true }
      unit: { type: string, required: true }
      equipment: { type: string, required: true }
    validationRules: "z.object({ facility: z.string().min(2), area: z.string().min(2), unit: z.string().min(2), equipment: z.string().min(2) })"

  - fieldId: workDescription
    label: "Descripción de los Trabajos y Fuente de Ignición"
    type: string
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    captureMethod: UI_TEXTAREA
    validationRules: "z.string().min(5, 'La descripción debe tener al menos 5 caracteres')"

  - fieldId: artNumber
    label: "Análisis de Riesgos N° (PDVSA IR-S-17)"
    type: string
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    captureMethod: UI_LINKED_DOCUMENT_PICKER
    validationRules: "z.string().min(3, 'El número de ART es obligatorio')"
    evidenceRequired: "Documento ART en estado APPROVED"

  - fieldId: procedureNumber
    label: "Procedimiento de Trabajo N° (PDVSA SI-S-20)"
    type: string
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    captureMethod: UI_LINKED_DOCUMENT_PICKER
    validationRules: "z.string().min(3, 'El número de Procedimiento es obligatorio')"

  - fieldId: executorInfo
    label: "Ejecutor del Trabajo y N° de Personas"
    type: object
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    properties:
      type: { type: enum, enumValues: ["PDVSA", "CONTRATISTA"] }
      companyName: { type: string, required: true }
      workerCount: { type: integer, min: 1 }

  - fieldId: specialCertificates
    label: "Certificados Especiales Requeridos (Anexos B-L)"
    type: array
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    itemsType: enum
    enumValues:
      - ESPACIOS_CONFINADOS_ANEXO_B
      - IZAMIENTO_CARGAS_ANEXO_C
      - RADIACIONES_IONIZANTES_ANEXO_D
      - EXCAVACION_ANEXO_E
      - SISTEMA_ELECTRICO_ANEXO_F
      - SUBACUATICOS_ANEXO_G
      - HOT_TAPPING_ANEXO_H
      - AREAS_COMPARTIDAS_ANEXO_I
      - ALTURA_ANEXO_J
      - FUMIGACION_ANEXO_K
      - SOLDADURA_ANEXO_L
      - NO_APLICA

  - fieldId: equipmentPreparation
    label: "Preparación de Recipientes, Equipos y Tuberías"
    type: object
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    properties:
      washed: { type: boolean, solvent: string }
      purged: { type: boolean, agent: string }
      inerted: { type: boolean, agent: string }
      depressurized: { type: boolean, gaugeReading: string, gaugeLocation: string }
      drained: { type: boolean, drainLocation: string, drainedProduct: string }
      isolated: { type: boolean }
      notApplicable: { type: boolean }

  - fieldId: verificationConditions
    label: "14 Condiciones Mínimas a Verificar (11.a al 11.n)"
    type: object
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 34
    properties:
      a_lotoIsolated: { type: boolean, required: true }
      b_electricalClassificationOk: { type: boolean, required: true }
      c_certificatesReviewed: { type: boolean, required: true }
      d_pyrophoricChecked: { type: boolean, required: true }
      e_artDisclosedToCrew: { type: boolean, required: true }
      f_eppAvailableAndGood: { type: boolean, required: true }
      g_fireEquipmentInPlace: { type: boolean, required: true }
      h_adjacentHazardsControlled: { type: boolean, required: true }
      i_weatherConditionsPermitted: { type: boolean, required: true }
      j_areaDemarcatedEvacuationClear: { type: boolean, required: true }
      k_workersNotifiedOfHazards: { type: boolean, required: true }
      l_emisorReceptorCertificationsValid: { type: boolean, required: true }
      m_otherConditionNotes: { type: string }
      n_instrumentationBypassAuthorized: { type: boolean, tagNo: string, reason: string }

  - fieldId: gasTestMatrix
    label: "Prueba de Gases Completa"
    type: object
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 35
    properties:
      testFrequency: { type: enum, enumValues: ["CONTINUA", "PERIODICA", "NO_APLICA"] }
      periodicityHours: { type: number, optional: true }
      readings:
        type: array
        items:
          readingIndex: { type: integer, min: 1, max: 5 }
          time: { type: string, format: "HH:MM AM/PM" }
          explosivityLelPercent: { type: number, referenceValue: "0% LEL" }
          oxygenPercent: { type: number, referenceValue: "19.5% - 23.5%" }
          toxicH2sPpm: { type: number, referenceValue: "<= 10 ppm" }
          toxicSo2Ppm: { type: number, referenceValue: "<= 2 ppm" }
          toxicAmoniacoPpm: { type: number, referenceValue: "<= 35 ppm" }
          toxicCoPpm: { type: number, referenceValue: "<= 25 ppm" }
          toxicCo2Ppm: { type: number, referenceValue: "<= 5000 ppm" }
          toxicBencenoPpm: { type: number, referenceValue: "<= 0.5 ppm" }
      measuringEquipmentDevice: { type: string, required: true }
      lastCalibrationDate: { type: string, required: true }
      evaluator:
        fullName: { type: string, required: true }
        nationalId: { type: string, required: true }
        signature: { type: string, required: true }

  - fieldId: permitValidity
    label: "Vigencia del Permiso"
    type: object
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 35
    properties:
      issueDate: { type: string, format: "YYYY-MM-DD" }
      startTime: { type: string, format: "HH:MM AM/PM" }
      validUntilTime: { type: string, format: "HH:MM AM/PM" }

  - fieldId: managementOfChange
    label: "Manejo del Cambio (MDC)"
    type: object
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 35
    properties:
      applied: { type: boolean }
      mdcNumber: { type: string }
      changeType: { type: enum, enumValues: ["TEMPORAL", "PERMANENTE", "DE_EMERGENCIA"] }
      approvedBy: { type: string }

  - fieldId: issuanceSignatures
    label: "Firmas Tripartitas de Otorgamiento"
    type: object
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 35
    properties:
      emisor: { fullName: string, nationalId: string, signature: string, timestamp: string }
      receptor: { fullName: string, nationalId: string, signature: string, timestamp: string }
      ejecutor: { fullName: string, nationalId: string, signature: string, timestamp: string }

  - fieldId: permitExtension
    label: "Prórroga del Permiso (Máximo 2 Horas)"
    type: object
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 35
    properties:
      extendedUntilTime: { type: string }
      gasTestCheck: { explosivityLel: number, oxygenPercent: number }
      emisorSignature: { type: string }
      receptorSignature: { type: string }
      ejecutorSignature: { type: string }

  - fieldId: permitCancellation
    label: "Cancelación del Permiso"
    type: object
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 35
    properties:
      cancelled: { type: boolean }
      reason: { type: string }
      dateTime: { type: string }
      actionTakenByRole: { type: enum, enumValues: ["EMISOR", "RECEPTOR", "INSPECTOR_SIHO"] }
      fullName: { type: string }
      nationalId: { type: string }
      signature: { type: string }

  - fieldId: permitClosure
    label: "Cierre del Permiso al Finalizar Labor"
    type: object
    required: true
    sourceDocument: PDVSA-IR-S-04
    sourcePage: 33
    instructivoPage: 35
    properties:
      closedTime: { type: string }
      emisorSignature: { fullName: string, nationalId: string, signature: string }
      receptorSignature: { fullName: string, nationalId: string, signature: string }
      ejecutorSignature: { fullName: string, nationalId: string, signature: string }
